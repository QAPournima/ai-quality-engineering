  <script src="./js/hq.js?v=noguide"></script>
  <script>
    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, function (c) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
      });
    }
    function renderCards(list, posts, sourceLabel) {
      posts.forEach(function (post) {
        var a = document.createElement("a");
        a.className = "write-card";
        a.href = post.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        var initial = (post.title || "A").replace(/^[^\w]+/, "").charAt(0).toUpperCase() || "A";
        var thumb = post.image
          ? '<img src="' + esc(post.image) + '" alt="" /><div class="fallback" hidden>' + esc(initial) + "</div>"
          : '<div class="fallback">' + esc(initial) + "</div>";
        a.innerHTML =
          '<div class="thumb">' + thumb + "</div>" +
          '<div class="body">' +
          '<p class="meta">' + sourceLabel + (post.displayDate ? " · " + esc(post.displayDate) : "") + "</p>" +
          "<h3>" + esc(post.title) + "</h3>" +
          "<p>" + esc(post.excerpt || "") + "</p>" +
          "</div>";
        list.appendChild(a);
        var img = a.querySelector("img");
        if (img) {
          img.addEventListener("error", function () {
            img.style.display = "none";
            var fb = a.querySelector(".fallback");
            if (fb) fb.hidden = false;
          });
        }
      });
    }
    var medium = [
      {
        title: "The Role of QA in an Agile Scrum Team",
        url: "https://medium.com/@qapournima/the-role-of-qa-in-an-agile-scrum-team-navigating-the-product-life-cycle-02fdffd3c4f1",
        excerpt: "How QA navigates the product life cycle inside Scrum.",
        displayDate: "10 Jan 2025",
        image: "https://static.wixstatic.com/media/cbe8c3_9dba09dfed6d4073ac436e6482601a19~mv2.png/v1/fit/w_1000,h_800,al_c,q_80/file.png"
      },
      {
        title: "Understanding Shift-Left Testing",
        url: "https://medium.com/@qapournima/understanding-shift-left-testing-a-comprehensive-guide-92a62360edb1",
        excerpt: "A practical guide to finding issues earlier.",
        displayDate: "20 Feb 2025",
        image: "https://static.wixstatic.com/media/78d045_634fe225a107441ca6a9ddfc58bd28f9~mv2.jpg/v1/fit/w_1000,h_1000,al_c,q_80/file.png"
      },
      {
        title: "AI-Driven Testing",
        url: "https://medium.com/@qapournima/ai-driven-testing-revolutionizing-software-testing-with-automation-and-efficiency-4b5308362560",
        excerpt: "Using automation and AI to test faster without losing quality.",
        displayDate: "13 Mar 2025",
        image: "https://cdn-images-1.medium.com/max/1024/0*acQxGvFklry1MdLl"
      },
      {
        title: "Breaking Silos in Agile Teams",
        url: "https://medium.com/@qapournima/breaking-silos-in-agile-teams-fostering-collaboration-and-alignment-863f5aea3f2c",
        excerpt: "Collaboration and alignment across engineering and QA.",
        displayDate: "Medium",
        image: ""
      }
    ];
    renderCards(document.getElementById("medium"), medium, "Medium");
    fetch("./writing/catalog.json")
      .then(function (res) { return res.json(); })
      .then(function (data) {
        renderCards(
          document.getElementById("wix"),
          (data.posts || []).filter(function (post) { return post.source !== "medium"; }),
          "Wix"
        );
      });
  </script>
